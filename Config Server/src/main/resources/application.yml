spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${GIT_URI}
          username: ${GIT_USER}
          password: ${GIT_TOKEN}

encrypt:
  key: ${ENCRYPT_KEY}

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh
  endpoint:
    health:
      show-details: always