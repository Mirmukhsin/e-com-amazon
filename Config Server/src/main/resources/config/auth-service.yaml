spring:
  application:
    name: auth-service
  datasource:
    url: "jdbc:postgresql://localhost:5432/auth_service_db"
    username: postgres
    password: 9779
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 8585

jwt:
  secret: 4a7b9c2d8e3f1a6b5c0d9e4f7a2b8c3d6e1f4a7b9c2d8e3f1a6b5c0d9e4f7a2b
  expiration: 900000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${server.port}