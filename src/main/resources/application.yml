spring:
  profiles:
    active: test

  application:
    name: E-com application (Amazon marketplace)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


springdoc:
  swagger-ui:
    path: "/swagger-ui.html"
  api-docs:
    path: "/v3/api-docs"
  show-actuator: true

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${WEBHOOK_SECRET_KEY}


jwt:
  secret: 4a7b9c2d8e3f1a6b5c0d9e4f7a2b8c3d6e1f4a7b9c2d8e3f1a6b5c0d9e4f7a2b
  expiration: 86400000

server:
  servlet:
    context-path: "/api/v1"