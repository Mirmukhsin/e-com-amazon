services:

  #  PostgreSQL Database
  db:
    image: postgres:16
    container_name: ecom_db
    environment:
      POSTGRES_DB: ecomdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 9779
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecom_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #   Spring Boot App
  app:
    build: .
    container_name: ecom_app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USERNAME: postgres
      DB_PASSWORD: 9779
      JWT_SECRET: 4a7b9c2d8e3f1a6b5c0d9e4f7a2b8c3d6e1f4a7b9c2d8e3f1a6b5c0d9e4f7a2b
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WH_KEY}
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecom_network
    restart: on-failure

volumes:
  postgres_data:

networks:
  ecom_network:
    driver: bridge